[project]
name = "phonesystem"
version = "0.1.0"
description = "Linux phone system (Asterisk-based) with a web UI, built for Avaya 9608 SIP phones"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
phonesystem = "phonesystem.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phonesystem*"]

[tool.setuptools.package-data]
phonesystem = ["templates/**/*", "migrations/**/*", "alembic.ini"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["phonesystem/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S104",  # binding to 0.0.0.0 is intended for a PBX
    "S311",  # non-crypto random is not used for secrets (we use secrets)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Asterisk and SIPp installed (run with -m integration)",
]
addopts = "-m 'not integration'"
filterwarnings = [
    # starlette's TestClient suggests a successor to httpx; httpx works fine.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
