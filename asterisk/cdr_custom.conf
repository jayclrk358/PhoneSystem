; PhoneSystem call records (installed to /etc/asterisk/cdr_custom.conf).
; Asterisk appends one line per call leg to
; /var/log/asterisk/cdr-custom/phonesystem-calls.csv, and PhoneSystem imports
; it into the web UI's call log. The first column is the format version; bump
; it (and the importer) when the columns change.

[mappings]
phonesystem-calls.csv => v1,${CSV_QUOTE(${CDR(uniqueid)})},${CSV_QUOTE(${CDR(linkedid)})},${CSV_QUOTE(${CDR(sequence)})},${CSV_QUOTE(${CDR(start,u)})},${CSV_QUOTE(${CDR(answer,u)})},${CSV_QUOTE(${CDR(end,u)})},${CSV_QUOTE(${CDR(duration)})},${CSV_QUOTE(${CDR(billsec)})},${CSV_QUOTE(${CDR(disposition)})},${CSV_QUOTE(${CDR(src)})},${CSV_QUOTE(${CDR(clid)})},${CSV_QUOTE(${CDR(dst)})},${CSV_QUOTE(${CDR(channel)})},${CSV_QUOTE(${CDR(dstchannel)})},${CSV_QUOTE(${CDR(lastapp)})},${CSV_QUOTE(${CDR(ps_dialed)})},${CSV_QUOTE(${CDR(ps_route)})}
