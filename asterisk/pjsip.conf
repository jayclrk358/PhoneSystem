; PhoneSystem base PJSIP config (installed to /etc/asterisk/pjsip.conf).
; Transports, extensions and trunks are generated by the web UI into the
; phonesystem/ directory and pulled in by the #tryinclude at the bottom.

[global]
type=global
user_agent=PhoneSystem PBX
; Log a security event when one address keeps sending requests that don't
; match any extension (fail2ban watches security.log for these).
unidentified_request_count=5
unidentified_request_period=5

#tryinclude phonesystem/pjsip.generated.conf
