; PhoneSystem base dialplan (installed to /etc/asterisk/extensions.conf).
; Per-extension dialplan is generated by the web UI into
; phonesystem/extensions.generated.conf (included at the bottom).

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]

; Calls placed by our own phones.
[from-internal]
include => phonesystem-extensions
include => phonesystem-features
include => phonesystem-invalid

[phonesystem-features]
; *43: echo test. You hear your own voice back; handy for checking a new phone.
exten => *43,1,Answer()
 same => n,Wait(0.5)
 same => n,Echo()
 same => n,Hangup()

; Anything that didn't match above.
[phonesystem-invalid]
exten => _[0-9*#+],1,Goto(not-in-service,1)
exten => _[0-9*#+].,1,Goto(not-in-service,1)
exten => not-in-service,1,Answer()
 same => n,Wait(0.3)
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; Ring one extension. ARG1 = extension number.
[phonesystem-dial-extension]
exten => s,1,Dial(PJSIP/${ARG1},30)
 same => n,Return()

; Placeholder so the include above resolves before the first apply.
[phonesystem-extensions]

#tryinclude phonesystem/extensions.generated.conf
