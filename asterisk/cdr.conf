; PhoneSystem call records (installed to /etc/asterisk/cdr.conf).

[general]
enable=yes
; Record calls nobody answered too, so missed calls show up in the call log.
unanswered=yes
congestion=yes
; Write each record as soon as the call ends.
batch=no

[csv]
; Asterisk's own CSV log (/var/log/asterisk/cdr-csv/Master.csv) stays on as a backup.
usegmtime=yes
loguniqueid=yes
accountlogs=no
