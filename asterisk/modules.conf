; PhoneSystem module list (installed to /etc/asterisk/modules.conf).

[modules]
autoload=yes

; Old or unused channel drivers. chan_sip would fight PJSIP for port 5060,
; and chan_unistim listens on port 5000.
noload => chan_sip.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
noload => chan_iax2.so
noload => chan_ooh323.so
noload => chan_alsa.so
noload => chan_oss.so
noload => chan_console.so
noload => chan_mobile.so
noload => chan_dahdi.so

; Alternative dialplan languages we don't use.
noload => pbx_ael.so
noload => pbx_lua.so
noload => pbx_dundi.so

; Unused variants and add-ons that only log errors at startup.
noload => res_pjsip_config_wizard.so
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
noload => app_festival.so
noload => res_snmp.so
